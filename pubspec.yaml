name: occhio_al_borgo
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  share_plus: ^10.0.0
  screenshot: ^3.0.0

  # 🌍 Localizzazione e internazionalizzazione (usiamo file .dart, non .arb)
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # 🔥 Firebase (compatibili e stabili)
  firebase_core: ^4.2.0
  firebase_auth: ^6.1.1
  cloud_firestore: ^6.0.3
  firebase_storage: ^13.0.3
  cloud_functions: ^6.0.0

  # 📂 Gestione file locali
  path_provider: ^2.1.4

  # 🔐 Autenticazione e preferenze
  local_auth: ^3.0.0
  shared_preferences: ^2.3.2

  # 📷 Fotocamera e sensori
  camera: ^0.11.0+1
  geolocator: ^14.0.2
  sensors_plus: ^7.0.0
  image_picker: ^1.1.2

  # ⚡️ Batteria e connessione
  battery_plus: ^7.0.0
  connectivity_plus: ^7.0.0

  # 🌍 URL esterni
  url_launcher: ^6.3.0

  # 🖼️ Interfaccia e icone
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  # 🚫 Disabilita la generazione automatica .arb
  uses-material-design: true

  assets:
    - assets/images/logo_pages.png
    - assets/images/login_bg.png
    - assets/images/borgo_placeholder.png
    - assets/data/eventi_liguria.json
    - assets/data/borghi_min.json
    - assets/data/badges.json
    - assets/images/demo1.jpg
    - assets/images/demo2.jpg
    - assets/images/demo3.jpg

  fonts:
    - family: Cinzel
      fonts:
        - asset: assets/fonts/Cinzel-Regular.ttf
        - asset: assets/fonts/Cinzel-Bold.ttf
          weight: 700
    - family: Cormorant
      fonts:
        - asset: assets/fonts/CormorantGaramond-VariableFont_wght.ttf

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/logo_pages.png"
  adaptive_icon_foreground: "assets/images/logo_pages.png"
  adaptive_icon_background: "#FFFFFF"
