name: occhio_al_borgo
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # 🔐 Autenticazione e preferenze
  local_auth: ^2.3.0
  shared_preferences: ^2.3.2

  # 📷 Fotocamera e sensori
  camera: ^0.11.0+1
  geolocator: ^13.0.1
  sensors_plus: ^6.0.1

  # ⚡️ Batteria e connessione
  battery_plus: ^5.0.2
  connectivity_plus: ^6.0.3

  # 🖼️ Interfaccia e immagini
  cupertino_icons: ^1.0.8
  image_picker: ^1.1.2
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo_pages.png
    - assets/images/login_bg.png
    - assets/images/borgo_placeholder.png
    - assets/data/eventi_liguria.json
    - assets/data/borghi_min.json

  fonts:
    - family: Cinzel
      fonts:
        - asset: assets/fonts/Cinzel-Regular.ttf
        - asset: assets/fonts/Cinzel-Bold.ttf
          weight: 700
    - family: Cormorant
      fonts:
        - asset: assets/fonts/CormorantGaramond-VariableFont_wght.ttf

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/logo_pages.png"
  adaptive_icon_foreground: "assets/images/logo_pages.png"
  adaptive_icon_background: "#FFFFFF"
